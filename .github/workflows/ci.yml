name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main for version compare
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Check PowerShell scripts are ASCII
        run: python3 scripts/check-ps1-ascii.py

      - name: Check release package identity
        run: python3 scripts/check-version.py --check-identity

      - name: Check version identity
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/check-version.py --base-ref origin/main
          else
            python3 scripts/check-version.py --match-only
          fi

  build-test:
    runs-on: windows-latest
    needs: version-check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore Palace.csproj -p:Platform=x64 -r win-x64
          dotnet restore Palace.Tests/Palace.Tests.csproj

      # Diligent FetchContent source tree (~10 min cold). Keyed on tag + Native/smooth sources.
      # Palace.csproj DefaultItemExcludes Native\smooth\build\** so .NET / SPIRV .cs are not compiled.
      - name: Cache DiligentCore _deps
        uses: actions/cache@v4
        with:
          path: Native/smooth/build/_deps
          key: palace-smooth-diligent-v2.5.6-${{ hashFiles('Native/smooth/CMakeLists.txt', 'Native/smooth/src/**', 'Native/smooth/include/**') }}

      # Smooth Viewer V0: Diligent presenter DLL (FetchContent DiligentCore).
      # In-tree build/_deps is gitignored + DefaultItemExcluded (no SharpGen / Diligent.NET).
      - name: Build palace_smooth.dll (Diligent)
        shell: pwsh
        run: |
          $build = "Native/smooth/build"
          cmake -S Native/smooth -B $build -A x64 -DCMAKE_BUILD_TYPE=Release -DPALACE_SMOOTH_WITH_DILIGENT=ON
          cmake --build $build --config Release --parallel
          New-Item -ItemType Directory -Force -Path Native/smooth/win-x64 | Out-Null
          $dll = Get-ChildItem -Path $build -Recurse -Filter palace_smooth.dll | Select-Object -First 1
          if (-not $dll) { throw "palace_smooth.dll not found after cmake build" }
          Copy-Item -Force $dll.FullName Native/smooth/win-x64/palace_smooth.dll
          Write-Host "Packaged $($dll.FullName) -> Native/smooth/win-x64/palace_smooth.dll"

      # Runtime HLSL uses D3DCompile (d3dcompiler) / Diligent FXC path — no dxcompiler/dxil package.
      # Refuse Diligent shared or DXC DLLs as dependents (static link only).
      - name: Verify palace_smooth.dll dependents
        shell: pwsh
        run: |
          $dll = Resolve-Path "Native/smooth/win-x64/palace_smooth.dll"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem -Path $vs -Recurse -Filter dumpbin.exe |
            Where-Object { $_.FullName -match '\\Hostx64\\x64\\dumpbin\.exe$' } |
            Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found under $vs" }
          $out = & $dumpbin.FullName /DEPENDENTS $dll.Path 2>&1 | Out-String
          Write-Host $out
          $bad = @('dxcompiler', 'dxil', 'GraphicsEngineD3D', 'Diligent', 'glslang', 'SPIRV')
          foreach ($name in $bad) {
            if ($out -match [regex]::Escape($name)) {
              throw "palace_smooth.dll must not depend on $name (got: matched in dumpbin output)"
            }
          }
          foreach ($need in @('d3d12.dll', 'dxgi.dll', 'd3dcompiler')) {
            if ($out -notmatch [regex]::Escape($need)) {
              Write-Warning "Expected system dep hint '$need' not seen (may be delay-loaded); continuing"
            }
          }

      # Full MarkupCompile with RID (same XAML path as winapp run / packaged Debug).
      # --no-incremental forces a clean XAML pass so WMC9999-class failures are not skipped.
      - name: Build Palace (Debug x64, packaged TFM/RID)
        run: >
          dotnet build Palace.csproj -c Debug -p:Platform=x64 -r win-x64
          --no-restore --no-incremental

      # Packaged path used by BuildAndRun.ps1 / winapp (single-project MSIX).
      # Unsigned: no cert secret required; still exercises GenerateAppxPackageOnBuild.
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Palace packaged (Debug x64 MSIX, unsigned)
        run: >
          msbuild Palace.csproj
          /p:Configuration=Debug
          /p:Platform=x64
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageSigningEnabled=false
          /p:AppxBundle=Never
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:AppxPackageDir=Artifacts\Msix\
          /restore

      - name: Verify palace_smooth.dll at Appx package root
        shell: pwsh
        run: |
          $hits = Get-ChildItem -Path Artifacts\Msix -Recurse -Filter palace_smooth.dll -ErrorAction SilentlyContinue
          if (-not $hits) { throw "palace_smooth.dll missing from Artifacts\Msix" }
          $ok = $false
          foreach ($f in $hits) {
            Write-Host "Found $($f.FullName)"
            # Package root: ...\Palace_*\palace_smooth.dll (not nested under smooth\)
            if ($f.Directory.Name -match '^Palace' -or $f.Directory.Name -eq 'AppX' -or (Test-Path (Join-Path $f.DirectoryName 'Palace.exe'))) {
              $ok = $true
            }
            # Also accept layout where DLL sits beside AppxManifest.xml
            if (Test-Path (Join-Path $f.DirectoryName 'AppxManifest.xml')) {
              $ok = $true
            }
          }
          if (-not $ok) {
            throw "palace_smooth.dll not at package root (beside AppxManifest / Palace.exe). Hits: $($hits.FullName -join '; ')"
          }

      - name: Test
        run: dotnet test Palace.Tests/Palace.Tests.csproj -c Debug --no-restore --logger "trx;LogFileName=results.trx"

      # Same Appx publish path as `winapp package --no-sign` (Release + PublishAppxPackage).
      # Catches XAML/compiler breaks that only surface when packaging MSIX.
      - name: Packaged Appx publish (Release x64, unsigned)
        run: |
          $appx = Join-Path $env:RUNNER_TEMP "palace-appx"
          New-Item -ItemType Directory -Path $appx -Force | Out-Null
          dotnet restore Palace.csproj -p:Platform=x64 -r win-x64 -p:Configuration=Release
          dotnet publish Palace.csproj `
            -c Release -r win-x64 --no-restore -v minimal -tl:off `
            -p:_IsPublishing=true `
            -p:Platform=x64 `
            -p:PublishAppxPackage=true `
            -p:GenerateAppxPackageOnBuild=false `
            -p:IncludePublishItemsOutputGroup=true `
            -p:AppxBundle=Never `
            -p:AppxPackageSigningEnabled=false `
            -p:AppxPackageDir="$appx\"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Palace.Tests/TestResults/*.trx
