name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main for version compare
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Check version identity
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/check-version.py --base-ref origin/main
          else
            python3 scripts/check-version.py --match-only
          fi

  build-test:
    runs-on: windows-latest
    needs: version-check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore Palace.csproj -p:Platform=x64
          dotnet restore Palace.Tests/Palace.Tests.csproj

      - name: Build Palace (Debug x64, no MSIX package)
        run: dotnet build Palace.csproj -c Debug -p:Platform=x64 --no-restore

      # Packaged path used by BuildAndRun.ps1 / winapp (single-project MSIX).
      # Unsigned: no cert secret required; still exercises GenerateAppxPackageOnBuild.
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Palace packaged (Debug x64 MSIX, unsigned)
        run: >
          msbuild Palace.csproj
          /p:Configuration=Debug
          /p:Platform=x64
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageSigningEnabled=false
          /p:AppxBundle=Never
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:AppxPackageDir=Artifacts\Msix\
          /restore

      - name: Test
        run: dotnet test Palace.Tests/Palace.Tests.csproj -c Debug --no-restore --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Palace.Tests/TestResults/*.trx