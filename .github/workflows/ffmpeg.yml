name: ffmpeg (slim LGPL build)

# Builds the slim LGPL ffmpeg.exe Palace bundles and publishes it as a release
# asset (tag ffmpeg-<ver>-palace<N>). Bump RELEASE_TAG (and the pin in
# tools/Get-Ffmpeg.ps1) when tools/build-ffmpeg.sh changes.
on:
  workflow_dispatch:
  push:
    paths:
      - tools/build-ffmpeg.sh
      - .github/workflows/ffmpeg.yml

env:
  RELEASE_TAG: ffmpeg-8.1.3-palace1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 nasm meson ninja-build pkg-config make xz-utils zip
      - name: Build
        run: tools/build-ffmpeg.sh out
      - uses: actions/upload-artifact@v4
        with:
          name: palace-ffmpeg
          path: out/*
      - name: Publish release (once per tag; never overwritten)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists; published asset hash:"; gh release download "$RELEASE_TAG" -p '*.sha256' -O -
          else
            gh release create "$RELEASE_TAG" out/*.zip out/*.sha256 --target "$GITHUB_SHA" \
              --title "Slim LGPL ffmpeg for Palace ($RELEASE_TAG)" \
              --notes "Built by tools/build-ffmpeg.sh at $GITHUB_SHA. FFmpeg (LGPL-2.1+) + dav1d (BSD-2). Source offer and exact configure line in SOURCE.txt inside the zip."
          fi
